<!DOCTYPE html>
<html lang="fr">
<head><link rel="stylesheet" href="index.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Huperoon - Enregistrement public</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>⛪ Huperoon-Church</h1>
    <p>Enregistrement de présence</p>
  </div>
  <div class="form-body">
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="nom" placeholder="Votre nom">
    </div>
    <div class="form-group">
      <label>Prénom *</label>
      <input type="text" id="prenom" placeholder="Votre prénom">
    </div>
    <div class="form-group">
      <label>Lieu / Quartier</label>
      <input type="text" id="lieu" placeholder="Optionnel">
    </div>
    <div class="form-group">
      <label>Contact (email ou tél)</label>
      <input type="text" id="contact" placeholder="Optionnel">
    </div>
    <div class="form-group">
      <label>Statut</label>
      <select id="statut">
        <option value="member">Membre de Huperoon-Church</option>
        <option value="visitor">Visiteur (autre église)</option>
      </select>
    </div>
    <div class="form-group" id="visitorGroup" style="display:none;">
      <label>Nom de votre église</label>
      <input type="text" id="eglise" placeholder="Nom de l'église">
    </div>
    <button id="btnEnregistrer">✨ Enregistrer ma présence</button>
    <footer>Vos données sont confidentielles</footer>
  </div>
</div>
<div id="toast" class="toast">✅ Enregistrement réussi</div>

<script>
  // -------- REMPLACEZ CES VALEURS PAR VOTRE CONFIG FIREBASE --------
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCv9PrIEj88ejfB1gVJK5FnS-AJaWWS0Gc",
  authDomain: "registre-huperoon.firebaseapp.com",
  projectId: "registre-huperoon",
  storageBucket: "registre-huperoon.firebasestorage.app",
  messagingSenderId: "415248511573",
  appId: "1:415248511573:web:26bb0869aa570e933fdadc",
  measurementId: "G-QLH7RZN4EL"
};
  // ----------------------------------------------------------------

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.getElementById('statut').addEventListener('change', function(e) {
    document.getElementById('visitorGroup').style.display = e.target.value === 'visitor' ? 'block' : 'none';
  });

  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.backgroundColor = type === 'success' ? '#28a745' : '#dc3545';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.getElementById('btnEnregistrer').onclick = async () => {
    const nom = document.getElementById('nom').value.trim();
    const prenom = document.getElementById('prenom').value.trim();
    if (!nom || !prenom) {
      showToast('Nom et prénom requis', 'error');
      return;
    }
    const statut = document.getElementById('statut').value;
    const isMember = statut === 'member';
    const churchName = isMember ? null : document.getElementById('eglise').value.trim() || 'Non spécifiée';

    const data = {
      nom, prenom,
      lieu: document.getElementById('lieu').value.trim() || '',
      contact: document.getElementById('contact').value.trim() || '',
      is_member: isMember,
      church_name: churchName,
      date: new Date().toISOString(),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    const btn = document.getElementById('btnEnregistrer');
    btn.disabled = true;
    btn.textContent = '⏳ Envoi...';
    try {
      await db.collection('presences').add(data);
      showToast(`✅ ${prenom} ${nom} enregistré(e) !`);
      document.getElementById('nom').value = '';
      document.getElementById('prenom').value = '';
      document.getElementById('lieu').value = '';
      document.getElementById('contact').value = '';
      document.getElementById('eglise').value = '';
      document.getElementById('statut').value = 'member';
      document.getElementById('visitorGroup').style.display = 'none';
    } catch (error) {
      console.error(error);
      showToast('❌ Erreur réseau', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ Enregistrer ma présence';
    }
  };
</script>
</body>
</html>
